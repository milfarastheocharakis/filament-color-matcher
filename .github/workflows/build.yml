name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyinstaller==6.11.1 pytest openpyxl==3.1.5

      - name: Run tests
        run: python -m pytest -q tests

      - name: Download a snapshot of the Google Sheet (bundled as offline fallback)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://docs.google.com/spreadsheets/d/1iFt5MCwUX8yB8hIwSoFZDM_vs67eL0S78uYKMnQlBxI/export?format=csv&gid=516579939" -OutFile data.csv
          Get-Content data.csv -TotalCount 3

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name FilamentColorMatcher --icon assets/logo.ico --add-data "data.csv;." --add-data "assets;assets" app.py

      - name: Build shareable exe (no Pokémon sheet built in)
        shell: pwsh
        run: |
          Set-Content -Path edition.py -Value "FRIENDS = True"
          pyinstaller --noconfirm --onefile --windowed --name FilamentColorMatcher-Shared --icon assets/logo.ico --add-data "assets;assets" app.py

      - name: Smoke test (launch the exe and take a screenshot)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist/FilamentColorMatcher.exe -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: FilamentColorMatcher
          path: dist/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Filament Color Matcher v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            dist/FilamentColorMatcher.exe
            dist/FilamentColorMatcher-Shared.exe
          body: |
            - **FilamentColorMatcher.exe** – with the Pokéball color sheet built in.
            - **FilamentColorMatcher-Shared.exe** – clean version to share: no sheet, just your filaments, your own designs, .3mf import and printed tracking.

            Double-click to run. No install needed.
            Windows SmartScreen may warn because the app isn't signed: click "More info" → "Run anyway".
